# These fields define the image and environment names as well as the
# mission environment's python version and expected availability dates.
# The deployment name defines which base overall build process is used.
image_spec_header:
  image_name: RomanNexus-2026.2
  deployment_name: wrangler
  kernel_name: RomanNexus-2026.2
  display_name: Roman Research Nexus 2026.2
  description: |
    This spec is for final Roman's pre-launch release
  valid_on: '2026-09-15'
  expires_on: '2027-02-15'
  python_version: '3.13'

# These are the git repositories and branch/tag/hash that will be
# used to define packages, data, and installed notebooks.
repositories:
  roman_notebooks:
    url: https://github.com/spacetelescope/roman_notebooks.git
    ref: "2026.2"

# This is system config that is generally not changed by curators.
system:
  spec_version: '2.3'
  archive_format: .tar
  # The primary repo
  primary_repo: spacetelescope/roman_notebooks
  nb-wrangler:
    repo: https://github.com/spacetelescope/nb-wrangler.git
    ref: main
  spi:
    repo: https://github.com/spacetelescope/science-platform-images.git
    ref: main
  commands:
    # default is "uv pip".  SPI had to use pip.  pip not picky about pyproject.toml version;  uv crashes
    pip: pip
    # choose this over any env var setting but not CLI
    favor: spec
  date_updated: '2026-08-07T19:08:31.973535'
  spec_sha256: 8766ebd340c2ae854470530ef0f22687a5adc3f493cf3c08701fd94397b847bb

# Supported notebooks that will define the environment and by sync'ed to the science platform.
selected_notebooks:
  roman_all:
    repo: roman_notebooks
    root_directory: notebooks/
    include_subdirs:
      - '.*'
  # -----   exclude_subdirs:
  # -----     - data_visualization/data_visualization.ipynb
  # ----- roman_data_viz:
  # -----   repo: roman_notebooks
  # -----   root_directory: notebooks/
  # -----   include_subdirs:
  # -----     - data_visualization/data_visualization.ipynb
  # -----   tests:
  # -----     papermill: 'False'

# Packages installed by mamba in the mission environment only.
extra_mamba_packages:
  - pip

# Packages installed by mamba in both base and mission environments.
common_mamba_packages: []

# Packages are installed by pip or uv pip in the mission environment only.
extra_pip_packages:
  - boto3
  - lsstdesc.coord
  - healpy>=1.20.b1
  - jdaviz >= 5.0 # motorcyle
  - git+https://github.com/snbianco/astroquery.git@2026.2

# Packages installed by pip or uv pip in both base and mission environments.
common_pip_packages:
  - git+https://github.com/spacetelescope/nb-wrangler.git@main
  - bqplot>=0.12.47,<0.13
  - motorcycle==0.1.2
  - dotenv
  - jupyter-collaboration<5
  - jupyter-server-ydoc<3

# Packages for which overall dependency constaints overridden. May defeat
# overall constraint resolution since it is overriding these w/o concern
# for conflicts.
# override_pip_versions:
# - git+https://github.com/spacetelescope/mast-aladin.git@main
# - git+https://github.com/spacetelescope/mast-table.git@main
# - jdaviz @ git+https://github.com/spacetelescope/jdaviz@main
# - bqplot @ git+https://github.com/bmorris3/bqplot@pandas3
# - bqplot-gl @ git+https://github.com/bqplot/bqplot-gl@0.1.0a0

# A text file that will be injected into image builds and executed by Docker.
dockerfile_aux_sh: |
  #! /bin/bash
  set -euxo pipefail

# Image-specific files that are downloaded and/or copied to the specified locations in images
assets:
  - repo: https://github.com/spacetelescope/nb-wrangler-images.git
    ref: main
    items:
      # ----- - source: assets/roman/
      # -----   destination: /opt/environments
      # ----- - source: assets/generic/
      # -----   destination: /opt/environments
      - source: assets/generic/catalog-schema-browser.ipynb
        destination: /opt/environments
      - source: assets/roman/cost-dashboard.ipynb
        destination: /opt/environments
      - source: assets/generic/stop_server_ext.json
        destination: /etc/jupyter/jupyter_server_config.d/
      - source: assets/generic/stop_server_ext.json
        destination: /srv/jupyter/
      - source: assets/generic/jp_app_launcher.yaml
        destination: $HOME/.local/share/jupyter/jupyter_app_launcher/
      - source: assets/generic/post-start-hook
        destination: /opt/environments

environment_vars:
  PYTHONPATH: /srv/jupyter:$PYTHONPATH

test_environment_vars:
  CI: "true"

# ----------------------------------------------------------------------------------
# If defined, these replace defaults while in --dev development mode.
# --dev mode is the default for --curate and enables these
# --prod mode is the default for --reinstall and disables these.
dev_overrides:
  commands:
    # default is "uv pip".  SPI had to use pip.  pip not picky about pyproject.toml version;  uv crashes
    pip: pip
    # choose this over any env var setting but not CLI
    favor: spec
  repositories:
    roman_notebooks:
      url: https://github.com/spacetelescope/roman_notebooks.git
      ref: main  # not 2026.2
  system:
    spi:
      repo: https://github.com/jaytmiller/science-platform-images.git
      ref: dev
    nb-wrangler:
      repo: https://github.com/jaytmiller/nb-wrangler.git
      ref: dev
  common_pip_packages:
    - git+https://github.com/jaytmiller/nb-wrangler.git@dev

# ----------------------------------------------------------------------------------
# Everything in this section is generated during --curate and used for documentation
# and --reinstall using locked requirements.
out:
  data:
    spec_inputs:
      references/roman_notebooks/refdata_dependencies.yaml:
        install_files:
          pandeia_data:
            version: '2026.1'
            environment_variable: pandeia_refdata
            install_path: ${HOME}/refdata/
            data_path: pandeia_data-2026.1-roman
            data_url:
              - https://stsci.box.com/shared/static/0qjvuqwkurhx1xd13i63j760cosep9wh.gz
          pandeia_psf:
            version: '2026.1'
            environment_variable: PSF_DIR
            install_path: ${HOME}/refdata/
            data_path: pandeia_psfs-2026.1-roman
            data_url:
              - https://stsci.box.com/shared/static/5qkyvr5steg2fo2zxbqj2jxcmbmz1c4w.gz
          stpsf:
            version: 2.1.0
            environment_variable: STPSF_PATH
            install_path: ${HOME}/refdata/
            data_path: stpsf-data
            data_url:
              - https://stsci.box.com/shared/static/kqfolg2bfzqc4mjkgmujo06d3iaymahv.gz
          stips:
            version: 2.3.0
            environment_variable: stips_data
            install_path: ${HOME}/refdata/
            data_path: stips_data
            data_url:
              - https://stsci.box.com/shared/static/761vz7zav7pux03fg0hhqq7z2uw8nmqw.tgz
          synphot:
            version: 1.6.0
            environment_variable: PYSYN_CDBS
            install_path: ${HOME}/refdata/
            data_path: grp/redcat/trds/
            data_url:
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_everything_multi_v18_sed.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_star-galaxy-models_multi_v3_synphot2.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_castelli-kurucz-2004-atlas_multi_v2_synphot3.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_kurucz-1993-atlas_multi_v2_synphot4.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_pheonix-models_multi_v3_synphot5.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_calibration-spectra_multi_v13_synphot6.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_jwst_multi_etc-models_multi_v1_synphot7.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_modewave_multi_v1_synphot8.tar
              - https://archive.stsci.edu/hlsps/reference-atlases/hlsp_reference-atlases_hst_multi_other-spectra_multi_v2_sed.tar
        other_variables:
          CRDS_SERVER_URL: https://roman-crds.stsci.edu
          CRDS_CONTEXT: roman-edit
          CRDS_OBSERVATORY: roman
          CRDS_PATH: ${HOME}/crds_cache
    spec_exports:
      pandeia_refdata: ${HOME}/refdata/pandeia_data-2026.1-roman
      PSF_DIR: ${HOME}/refdata/pandeia_psfs-2026.1-roman
      STPSF_PATH: ${HOME}/refdata/stpsf-data
      stips_data: ${HOME}/refdata/stips_data
      PYSYN_CDBS: ${HOME}/refdata/grp/redcat/trds/
      CRDS_SERVER_URL: https://roman-crds.stsci.edu
      CRDS_CONTEXT: roman-edit
      CRDS_OBSERVATORY: roman
      CRDS_PATH: ${HOME}/crds_cache
    pantry_exports:
      pandeia_refdata: 
        ${NBW_PANTRY}/shelves/RomanNexus-2026.2/data/pandeia_data-2026.1-roman
      PSF_DIR: 
        ${NBW_PANTRY}/shelves/RomanNexus-2026.2/data/pandeia_psfs-2026.1-roman
      STPSF_PATH: ${NBW_PANTRY}/shelves/RomanNexus-2026.2/data/stpsf-data
