      PYSYN_CDBS: ${NBW_PANTRY}/shelves/RomanNexus-2026.2/data/grp/redcat/trds
      CRDS_SERVER_URL: https://roman-crds.stsci.edu
      CRDS_CONTEXT: roman-edit
