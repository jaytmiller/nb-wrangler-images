# =====================================================================================
# These fields define the image and kernel/environment names as well as the
# mission environment's python version and expected availability dates.
# The deployment name defines which base overall build process is used to
# map the definitions given in this spec onto a notebook image nominally defined
# on the GitHub spacetelescope/science-platform-images repo (SPI).
# =====================================================================================
image_spec_header:
  image_name: RomanNexus-2026.3
  deployment_name: wrangler
  kernel_name: RomanNexus-2026.3
  display_name: RomanNexus-2026.3
  description: |
    Production image for the RomanNexus-2026.3 release
  valid_on: '2026-11-24'
  expires_on: '2027-05-01'
  python_version: '3.13'

# =====================================================================================
# This is system config that is generally not changed by curators.
system:
  spec_version: '2.3'
  archive_format: .tar
  # The primary repo
  primary_repo: spacetelescope/roman_notebooks
  nb-wrangler:
    repo: https://github.com/spacetelescope/nb-wrangler.git
    ref: v0.9.5
  spi:
    repo: https://github.com/spacetelescope/science-platform-images.git
    ref: main
  commands:
    # default is "uv pip".  SPI had to use pip.  pip not picky about pyproject.toml version;  uv crashes
    pip: pip
    # choose this over any env var setting but not CLI
    favor: spec
  date_updated: '2026-11-25T12:15:59.005289'
  spec_sha256: bdb6c4ae822d578799c4e576c6a28da0b39a62ed1d7c9a707850b4d674c1bc46


# =====================================================================================
# Define the repositories form which notebooks covered by this spec/environment will
# be downloaded.  Then select specific notebooks in selected_notebooks:
# =====================================================================================
repositories:
  roman_notebooks:
    url: https://github.com/spacetelescope/roman_notebooks.git
    ref: '2026.3'

# =====================================================================================
# Notebooks selected here implicitly define additional image package requirements as well
# as packages to import test (--test-imports) and the complete list of notebooks for
# headless testing (--test-notebooks).  These notebook repos also define associated data
# and env vars based on root level refdata_dependencies.yaml files.
# =====================================================================================
selected_notebooks:
  roman_all:
    repo: roman_notebooks
    root_directory: notebooks/
    include_subdirs:
      - '.*'

  # -----   exclude_subdirs:
