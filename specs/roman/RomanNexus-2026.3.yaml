# =====================================================================================
# A shell script that will be injected into image builds and RUN by Docker as root
dockerfile_aux_sh: |
  #! /bin/bash
  set -euxo pipefail

  CUDA_VERSION="12-1"
  UBUNTU_VERSION="ubuntu2204"

  echo "Installing CUDA runtime ${CUDA_VERSION}..."

  # Install prerequisites
  apt-get update
  apt-get install -y --no-install-recommends \
    gnupg

  rm -rf /var/lib/apt/lists/*

  # Download and install NVIDIA repository keyring
  wget "https://developer.download.nvidia.com/compute/cuda/repos/${UBUNTU_VERSION}/x86_64/cuda-keyring_1.1-1_all.deb"

  dpkg -i cuda-keyring_1.1-1_all.deb
  rm -f cuda-keyring_1.1-1_all.deb

  # Install CUDA runtime
  apt-get update
  apt-get install -y --no-install-recommends \
    cuda-cudart-${CUDA_VERSION}

  rm -rf /var/lib/apt/lists/*

  echo "CUDA runtime installation complete."

