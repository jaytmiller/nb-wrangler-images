# Image header information
image_spec_header:
  image_name: TIKE-2026.2
  deployment_name: wrangler  # currenty tike, roman, or jwebbinar, or wrangler
  kernel_name: TIKE-2026.2   # currently tess, roman-cal, or masterclass (and conda env name)
  display_name: TIKE 2026.2  # menu item in JupyterLab kernel selection list
  description: |
    This spec is for the production version of the TIKE fall image.
  valid_on: '2026-09-01'
  expires_on: '2027-09-01'
  python_version: '3.13'

system:  # Ignore unless you're developing for wrangler or care about update date / hash
  spec_version: '2.3'
  archive_format: .tar
  primary_repo: spacetelescope/tike_content
  nb-wrangler:
    repo: https://github.com/spacetelescope/nb-wrangler.git
    ref: main
  spi:
    repo: https://github.com/spacetelescope/science-platform-images.git
    ref: main
  commands:
    # default is "uv pip".  SPI had to use pip.  pip not picky about pyproject.toml version;  uv crashes
    pip: pip
    # choose this over any env var setting but not CLI
    favor: spec
  date_updated: '2026-09-04T13:53:47.857539'
  spec_sha256: 9d63fbdd2a2a044bfb30510b48d459254f95113b7bc0931c887742c36488ad98

repositories:
  tike_content:
    url: https://github.com/spacetelescope/tike_content
    ref: main
  mast_notebooks:
    url: https://github.com/spacetelescope/mast_notebooks
    ref: main

selected_notebooks:
  tike_notebook_selection:
    repo: tike_content
    root_directory: content/notebooks/
    include_subdirs:
      - data-access/
      - lcviz-tutorial/
      - tglc/
      - zooniverse_view_lightcurve/
  mast_tess_kepler_selection:
    repo: mast_notebooks
    root_directory: notebooks/
    include_subdirs:
      - Kepler/measuring_a_rotation_period
      - HSC/HSC_TAP
      - interactive_data_exploration/how_to/browse_roman_observations
      - TESS/beginner_how_to_use_lc
      - TESS/beginner_tour_lc_tp
      - Kepler/identifying_transiting_planet_signals
      - Kepler/instrumental_noise_4_electronic_noise

apt_packages:
  - libgl1-mesa-dev   # for JDaviz
  - libglu1-mesa-dev
  - libglfw3-dev
  - libglew-dev

# Packages installed by mamba in the mission environment only.
extra_mamba_packages:
  - pip

# Packages installed by mamba in both base and mission environments.
common_mamba_packages: []

# Packages are installed by pip or uv pip in the mission environment only.
extra_pip_packages:
  - lsstdesc.coord
  - healpy>=1.20.b1
  - jdaviz >= 5.0 # motorcyle
  # For lcviz:
  - oktopus
  - autograd
  # - git+https://github.com/snbianco/astroquery.git@2026.2  # conflict with browse_roman_observations version

# Packages installed by pip or uv pip in both base and mission environments.
common_pip_packages:
  - bqplot-gl==0.0.0
  - bqplot>=0.12.47,<0.13
  - motorcycle==0.1.2
  - dotenv
  - jupyter-collaboration<5
  - jupyter-server-ydoc<3
  - nb-wrangler

# Packages for which overall dependency constaints overridden. May defeat
# overall constraint resolution since it is overriding these w/o concern
# for conflicts.
# override_pip_versions:
# - git+https://github.com/spacetelescope/mast-aladin.git@main
# - git+https://github.com/spacetelescope/mast-table.git@main
# - jdaviz @ git+https://github.com/spacetelescope/jdaviz@main
# - bqplot @ git+https://github.com/bmorris3/bqplot@pandas3
# - bqplot-gl @ git+https://github.com/bqplot/bqplot-gl@0.1.0a0

# A text file that will be injected into image builds and executed by Docker.
dockerfile_aux_sh: |
  #! /bin/bash
  set -euxo pipefail

# Image-specific files that are downloaded and/or copied to the specified locations in images
assets:
  - repo: https://github.com/spacetelescope/nb-wrangler-images.git
    ref: main
    items:
      - source: assets/tike/jp_app_launcher.yaml
        destination: /opt/environments
      - source: assets/generic/catalog-schema-browser.ipynb
        destination: /opt/environments
      - source: assets/generic/stop_server_ext.py
        destination: /etc/jupyter/jupyter_server_config.d/
      - source: assets/generic/stop_server_ext.json
        destination: /srv/jupyter/
      - source: assets/generic/post-start-hook
        destination: /opt/environments/post-start-hook
      - source: assets/generic/test
        destination: /opt/environments/test

environment_vars:
  PYTHONPATH: /srv/jupyter:$PYTHONPATH

test_environment_vars:
  CI: "true"

deactivated_dev_overrides:
  system:
    primary_repo: jaytmiller/tike_content
