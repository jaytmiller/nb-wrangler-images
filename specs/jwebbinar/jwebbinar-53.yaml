# These fields define the image and environment names as well as the
# mission environment's python version and expected availability dates.
# The deployment name defines which base overall build process is used.
image_spec_header:
  image_name: jwebbinar-53
  deployment_name: wrangler
  kernel_name: jwebbinar-53
  display_name: jwebbinar-53 (PICASO workshop)
  description: |
    Derived from JDaviz test image following final Roman's pre-launch release
  valid_on: '2026-10-19'
  expires_on: '2027-01-19'
  python_version: '3.11.8'


# This is system config that is generally not changed by curators.
system:
  spec_version: '2.3'
  archive_format: .tar
  # The primary repo
  primary_repo: spacetelescope/jwebbinar_prep
  nb-wrangler:
    repo: https://github.com/spacetelescope/nb-wrangler.git
    ref: main
  spi:
    repo: https://github.com/spacetelescope/science-platform-images.git
    ref: main
  date_updated: '2026-10-23T14:49:20.153520'
  spec_sha256: cbbc5fc929861425d77b6c5100c295bfc63403a9bcccbffed0fb5cca9a5315d1


# These are the git repositories and branch/tag/hash that will be
# used to define packages, data, and installed notebooks.
repositories:
  jwebbinar_prep:
    url: https://github.com/spacetelescope/jwebbinar_prep.git
    ref: main

selected_notebooks:
  jwebbinar53:
    repo: jwebbinar_prep
    root_directory: jwebbinar53/
    include_subdirs:
      - '.*'

apt_packages:
  - libgl-dev
  - mesa-utils
  - libgl1-mesa-dev
  - libglu1-mesa-dev
  - libglfw3-dev
  - libglew-dev

# Packages installed by mamba in the mission environment only.
extra_mamba_packages:
  - pip

# Packages installed by mamba in both base and mission environments.
common_mamba_packages: []

# Packages are installed by pip or uv pip in the mission environment only.
extra_pip_packages:
  - imviz
  - specviz
  - boto3
  - lsstdesc.coord
  - healpy>=1.20.b1
  - jdaviz<5.0.0
  # - git+https://github.com/snbianco/astroquery.git@2026.2  #????

# Packages installed by pip or uv pip in both base and mission environments.
common_pip_packages:
  - nb-wrangler
  - dotenv
  - jupyter-collaboration<5
  - jupyter-server-ydoc<3

# A text file that will be injected into image builds and executed by Docker.
dockerfile_aux_sh: |
  #! /bin/bash
  set -euxo pipefail


# Image-specific files that are downloaded and/or copied to the specified locations in images
assets:
  - repo: https://github.com/spacetelescope/nb-wrangler-images.git
    ref: main
    items:
      - source: assets/tike/jp_app_launcher.yaml
        destination: /opt/environments
      - source: assets/generic/catalog-schema-browser.ipynb
        destination: /opt/environments
      - source: assets/generic/stop_server_ext.json
        destination: /etc/jupyter/jupyter_server_config.d/
      - source: assets/generic/stop_server_ext.py
        destination: /srv/jupyter/
      - source: assets/jwebbinar/post-start-hook-53
        destination: /opt/environments/post-start-hook
      - source: assets/generic/test
        destination: /opt/environments/test

environment_vars:
  PYTHONPATH: /srv/jupyter:$PYTHONPATH

test_environment_vars:
  CI: "true"

# This declares some data dependency inputs here inline, to be curated in the out section with hashes, etc
refdata_dependencies:
  install_files:
    opacities:
      version: 0.3_15_R15000
      data_url:
        # - https://zenodo.org/records/14861730/files/opacities_0.3_15_R15000.db.tar.gz
        - https://stsci.box.com/shared/static/2e7mpm2e52uh89oqaj0tbywv5iv5xdb8.gz
      install_path: ${HOME}/refdata
      environment_variable: SP_OPACITY_FILE
      data_path: opacities_0.3_15_R15000.db
  other_variables: {}


