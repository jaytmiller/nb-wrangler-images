name: Reinstall (Use spec notebook, code, data locks)

# -- This workflow rebuilds an image from an existing completed spec using the
# -- spec repo and package pins. By default this workflow will use --prod mode
# -- (ignore overrides) but another robust way to ensure --prod is to disable
# -- --dev mode by disabling the overrides section of the wrangler spec
# -- using --spec-disable-spec-overrides which hides the overrides by changing
# -- the top level keyword to disabled_dev_overrides:.  To reenable dev overrides
# -- during --dev mode just remove the disabled_ prefix.

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'The path to the wrangler spec file in the notebook repo,  must be under specs/'
        required: false
        type: string
        default: 'specs/roman/nbw-wrangler-spec.yaml'
  workflow_call:
    inputs:
      spec_file:
        description: 'The path to the wrangler spec file in the notebook repo, must be under specs/'
        required: false
        type: string
        default: 'specs/roman/nbw-wrangler-spec.yaml'

defaults:
  run:
    shell: bash

jobs:
  nb-wrangler-reinstall:
    name: Reinstall (Prod, use spec notebook, code, data locks)
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read
      packages: write       # Allows GITHUB_TOKEN to push to GHCR
    # env:
    #   SPEC_INPUT: ${{ inputs.spec_file }}
    steps:
      - name: Checkout "Notebook Repo"
        uses: actions/checkout@v4

      - name: Limit spec locations to under directory specs/...
        shell: bash
        run: |
          set -euo pipefail

          fail() {
            printf '%s\n' "::error::Invalid spec path: $1" >&2
            exit 1
          }

          export SPEC_INPUT=${{ inputs.spec_file }}
          echo SPEC_INPUT=$SPEC_INPUT >>$GITHUB_ENV
          echo SPEC_INPUT: ${SPEC_INPUT}

          # Reject control characters, including newlines.
          [[ ! "$SPEC_INPUT" =~ [[:cntrl:]] ]] \
            || fail "control characters are not allowed"

          # Require the documented repository-relative format.
          [[ "$SPEC_INPUT" == specs/* ]] \
            || fail "expected a repository-relative path starting with specs/"

          repo_root="$(realpath -e -- "$GITHUB_WORKSPACE")" \
            || fail "cannot resolve repository root"

          # Do not allow the top-level specs directory itself to be a symlink.
          [[ -d "$repo_root/specs" && ! -L "$repo_root/specs" ]] \
            || fail "specs/ must be a real directory"

          # Reject parent-directory traversal.
          case "/$SPEC_INPUT/" in
          */../*) fail "parent-directory traversal is not allowed" ;;
          esac
          specs_root="$repo_root/specs"

          resolved="$(realpath -e -- "$repo_root/$SPEC_INPUT")" \
            || fail "file does not exist or cannot be resolved"

          # The slash after specs_root enforces a directory boundary.
          [[ "$resolved" == "$specs_root/"* ]] \
            || fail "file resolves outside specs/"

          [[ -f "$resolved" ]] \
            || fail "path must refer to a regular file"

          printf 'Validated spec: %s\n' "$resolved"

          # Primary spec workflow input
          echo NBW_SPEC=${resolved} >>$GITHUB_ENV

      - name: Set up system tools
        run: |
          git config --global user.email "homer@stsci.edu"
          git config --global user.name "Homer S."

      - name: Configure wrangler spec location, overrides mode, and repos directory
        run: |
          # name inside Dockerfile
          echo SPEC_NAME=nbw-wrangler-spec.yaml >>$GITHUB_ENV

          # Define where repo clones should be checked out, must be relative
          export NBW_REPOS_DIR="references"
          echo NBW_REPOS_DIR=$NBW_REPOS_DIR >>$GITHUB_ENV

          # Lock the spec requirements to dev mode (if available) during curation and
          # use dev_overrides:
          export NBW_OVERRIDES_MODE="--prod"
          echo NBW_OVERRIDES_MODE="--prod" >>$GITHUB_ENV

      - name: Checkout and configure wrangler for source repo (can be overridden for --dev)
        run: |
          COMMIT_SHA="62ce6587029d043e6c17fb2d873e16d567f16302"
          export WRANGLER_URL=https://github.com/spacetelescope/nb-wrangler.git
          export WRANGLER_REF="${COMMIT_SHA}"
          echo WRANGLER_URL=$WRANGLER_URL >> $GITHUB_ENV
          echo WRANGLER_REF=$WRANGLER_REF >> $GITHUB_ENV

          # Use the bootstrap script from master repo to resolve the target repo; used for bootstrap only
          curl https://raw.githubusercontent.com/spacetelescope/nb-wrangler/${COMMIT_SHA}  >nb-wrangler
          chmod +x nb-wrangler

          # Clone and configure exact wrangler source code,  nominally a prod copy or a (personal?) dev copy
          cd ${GITHUB_WORKSPACE}/..
          git clone ${WRANGLER_URL} nb-wrangler-tool
          cd nb-wrangler-tool
          git checkout ${WRANGLER_REF}

      - name: Bootstrap Wrangler
        run: |
          # Given the exact version of wrangler source code,  run the full bootstrap to set up a wrangler environment
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          ./nb-wrangler bootstrap
          source ./nb-wrangler environment
          micromamba install --yes syft grype

      - name: Validate Wrangler spec for image / environment
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          source ./nb-wrangler environment
          ./nb-wrangler $NBW_SPEC --spec-validate

      - name: Set up workflow env vars
        run: |
          # Both of owner/repo, e.g. spacetelescope/roman_notebooks
          export IMAGE_REPO=$GITHUB_REPOSITORY
          echo IMAGE_REPO=$IMAGE_REPO >>$GITHUB_ENV
          export IMAGE_ROOT=ghcr.io/$IMAGE_REPO
          echo IMAGE_ROOT=$IMAGE_ROOT >> $GITHUB_ENV

          # Full repo path of degenerate spec-only image, including tag
          ANS=$(./nb-wrangler --spec-name 2>/dev/null )_$GITHUB_RUN_NUMBER
          export SPEC_TAG="${ANS}"
          echo SPEC_TAG=$SPEC_TAG >> $GITHUB_ENV
          echo SPEC_IMAGE_ID=${IMAGE_ROOT}:${SPEC_TAG} >> $GITHUB_ENV

          # Full repo path of executable image, including tag
          ANS=$(./nb-wrangler --spi-image-name 2>/dev/null )_$GITHUB_RUN_NUMBER
          export IMAGE_TAG="${ANS}"
          echo IMAGE_TAG=$IMAGE_TAG  >> $GITHUB_ENV
          echo IMAGE_ID=${IMAGE_ROOT}:${IMAGE_TAG} >> $GITHUB_ENV

          # Nominally which classic mission (roman, tike, jwebbinar) or "wrangler" for generic builds
          # Note that generic builds have very little or no Docker-level customization, such as extra C programs
          # built under Docker using make.  Classic deployments
          ANS=$(yq -r .image_spec_header.deployment_name ${NBW_SPEC})
          export SPEC_DEPLOYMENT="${ANS}"
          echo  SPEC_DEPLOYMENT=$SPEC_DEPLOYMENT >> $GITHUB_ENV

          # Root location for curated data and environment archives, also needed for notebook tests
          source ./nb-wrangler environment
          echo NBW_PANTRY=$NBW_PANTRY >>$GITHUB_ENV

      - name: Log in to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Generate Dockerfile for spec
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          mkdir docker-root
          cd docker-root
          cp ${NBW_SPEC} .
          cat > Dockerfile << EOF
          FROM scratch
          COPY $(basename ${NBW_SPEC}) ${SPEC_NAME}
          EOF

      - name: Build Spec archive and push to GHCR
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool/docker-root
          docker build -t ${SPEC_IMAGE_ID} -f Dockerfile .
          docker push ${SPEC_IMAGE_ID}

      - name: Build Image and Push to GHCR
        run: |
          set -x
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          ./nb-wrangler --clone-repos --spi-inject-reqs --spi-image-build ${NBW_OVERRIDES_MODE}
          docker image ls
          docker tag notebook-${SPEC_DEPLOYMENT}:latest   ${IMAGE_ID}
          docker push ${IMAGE_ID}

      - name: Test imports inside image (adivsory)
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          source ./nb-wrangler environment
          cd $NBW_REPOS_DIR/science-platform-images

          # make dirs globally writable since uid/gid inside Docker may not match outside
          mkdir -p ${HOME}/crds_cache
          chmod -R 777 ${HOME}/crds_cache
          mkdir -p ${NBW_PANTRY}
          chmod -R 777 ${NBW_PANTRY}

          scripts/image-configure ${SPEC_DEPLOYMENT}
          source setup-env

          image-test --test-imports ${NBW_OVERRIDES_MODE}

      - name: Reinstall Data
        run: |
            cd $GITHUB_WORKSPACE/../nb-wrangler-tool
            ./nb-wrangler --data-reinstall

      - name: Test notebooks inside image (advisory)
        run: |
          cd $GITHUB_WORKSPACE/../nb-wrangler-tool
          cd $NBW_REPOS_DIR/science-platform-images
          source setup-env
          image-test --test-notebooks ${NBW_OVERRIDES_MODE}
          rm -rf $NBW_REPOS_DIR

      # ----- - name: Scan Image (advisory)
      # -----   run: |
      # -----     cd $GITHUB_WORKSPACE/../nb-wrangler-tool
      # -----     cd $NBW_REPOS_DIR/science-platform-images
      # -----     scripts/image-configure ${SPEC_DEPLOYMENT}
      # -----     source setup-env
      # -----     image-scan
