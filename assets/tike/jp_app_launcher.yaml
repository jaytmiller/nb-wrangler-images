# Docs: https://jupyter-app-launcher.readthedocs.io/en/latest/usage.html#configuration-file-content
# Default mode, just notebook. not auto-rendering, , disabled.

# notebook-voila requires voila to be installed in the system.

- title: "Catalog Schema Browser"
  description: "Open the schema browser"
  source: /opt/environments/catalog-schema-browser.ipynb
  type: notebook-voila

- title: Stop My Server
  description: Stop this Jupyter server
  source: ${JUPYTERHUB_SERVICE_PREFIX}stopme
  type: url
  args:
    createNewWindow: false
